backend:
  name: github
  repo: SpringbeeHub/sensorbees-hub
  branch: main
  auth_type: pkce
  app_id: Ov23li5KyrZgbV8Hmj6m

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "zh"

collections:
  - name: "pages"
    label: "📄 页面管理"
    folder: "pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "页面标题", name: "title", widget: "string" }
      - { label: "排序权重（越小越靠前）", name: "order", widget: "number", default: 0, value_type: "int" }
      - { label: "正文内容", name: "body", widget: "markdown" }

  - name: "products"
    label: "🛒 产品管理"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "产品名称", name: "title", widget: "string" }
      - { label: "产品分类", name: "category", widget: "select", options: ["Temperature & Humidity", "RS485 Industrial", "Analog (4~20mA)", "Agriculture", "Accessories"] }
      - { label: "产品简介", name: "description", widget: "text" }
      - { label: "产品图片", name: "image", widget: "image", required: false }
      - { label: "标签（如 Popular, Hot）", name: "badge", widget: "string", required: false }
      - { label: "详细参数", name: "body", widget: "markdown" }

  - name: "downloads"
    label: "📥 下载资源"
    folder: "downloads"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "资源标题", name: "title", widget: "string" }
      - { label: "描述", name: "description", widget: "text" }
      - { label: "文件链接", name: "file_url", widget: "string" }
      - { label: "图标 emoji", name: "icon", widget: "string", default: "📋" }
      - { label: "详情说明", name: "body", widget: "markdown", required: false }

  - name: "faq"
    label: "❓ FAQ 管理"
    folder: "faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "问题", name: "title", widget: "string" }
      - { label: "回答", name: "body", widget: "markdown" }
