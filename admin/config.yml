backend:
  name: github
  repo: SpringbeeHub/sensorbees-hub
  branch: main
  base_url: https://oauth.sensorbeeshub.com
  auth_endpoint: auth

media_folder: assets/uploads
public_folder: /assets/uploads
locale: zh

collections:
  - name: pages
    label: "📄 页面管理"
    folder: pages
    create: true
    slug: "{{slug}}"
    fields:
      - { label: 页面标题, name: title, widget: string }
      - { label: 关联产品, name: product, widget: relation, collection: products, value_field: title, search_fields: [title], required: false }
      - { label: 产品型号, name: models, widget: list, required: false, field: { label: 型号, name: model, widget: string } }
      - { label: 产品简介, name: description, widget: text, required: false }
      - { label: 核心特性, name: features, widget: list, required: false, field: { label: 特性, name: feature, widget: string } }
      - { label: 技术参数, name: specs, widget: list, required: false, field: { label: 参数, name: spec, widget: string } }
      - { label: 典型应用, name: applications, widget: list, required: false, field: { label: 应用场景, name: app, widget: string } }
      - { label: 应用场景图片, name: app_images, widget: list, required: false, field: { label: 图片, name: image, widget: image } }
      - { label: 详细说明, name: body, widget: markdown, required: false }
  - name: products
    label: "🛒 产品管理"
    folder: products
    create: true
    slug: "{{slug}}"
    fields:
      - { label: 产品名称, name: title, widget: string }
      - { label: 产品分类, name: category, widget: select, options: ["Temperature & Humidity", "RS485 Industrial", "Analog (4~20mA)", "Agriculture", "Accessories"] }
      - { label: 产品图片, name: image, widget: image, required: false }
      - { label: "标签（如 Popular, Hot）", name: badge, widget: string, required: false }
      - { label: 排序权重, name: order, widget: number, default: 0, value_type: int }
  - name: downloads
    label: "📥 下载资源"
    folder: downloads
    create: true
    slug: "{{slug}}"
    fields:
      - { label: 资源标题, name: title, widget: string }
      - { label: 资源分类, name: category, widget: select, options: ["Sensor Probes", "Wireless End Nodes"], required: true }
      - { label: 描述, name: description, widget: text, required: false }
      - label: 文件链接
        name: files
        widget: list
        required: false
        fields:
          - {label: 文件名称, name: name, widget: string}
          - {label: 文件类型, name: type, widget: select, options: [Datasheet, "User Guide", Certification, Firmware, Tool]}
          - {label: 文件链接, name: url, widget: string}
      - { label: "图标 emoji", name: icon, widget: string, default: "📋" }
      - { label: 详情说明, name: body, widget: markdown, required: false }
  - name: faq
    label: "❓ FAQ 管理"
    folder: faq
    create: true
    slug: "{{slug}}"
    fields:
      - { label: 问题, name: title, widget: string }
      - { label: 回答, name: body, widget: markdown }
