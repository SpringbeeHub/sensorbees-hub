<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ — SpringBees Hub</title>
    <link rel="stylesheet" href="style.css?v=1779898088">
    <link rel="icon" href="assets/springbee-icon.png" type="image/png">
    <style>
        .page-header {
            background: #1B2B48;
            padding: 6px 20px 12px;
            text-align: center;
            color: #fff;
        }
        .page-header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            position: absolute;
            top: 28px;
            left: 29px;
        }
        .page-header-brand img {
            height: 56px;
            width: auto;
        }
        .page-header-brand .brand-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .page-header-brand .brand-name .gold { color: #EAA924; }
        .page-header h1 { font-size: 1.5rem; margin-bottom: 4px; margin-top: 20px; }
        .page-header p { opacity: 0.8; font-size: 1.1rem; }
        .page-header {
            position: relative;
        }
        .back-link {
            display: inline-block;
            color: #fff; background: #032144; padding: 8px 20px; border-radius: 50px; display: inline-block;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .back-link:hover { text-decoration: underline; }
        .faq-nav {
            margin-bottom: 16px;
            padding-left: 0;
        }
        .faq-container {
            max-width: 86%;
            margin: 40px auto;
            padding: 0 20px;
        }
        @media (max-width: 1024px) {
            .faq-container { max-width: 90%; }
        }
        .loading { text-align: center; padding: 40px; color: #666; }
        .faq-container .faq-question {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 24px;
            cursor: pointer;
            font-weight: 600;
            color: var(--navy);
            transition: background 0.2s;
            gap: 12px;
            text-align: left;
            background: #fff;
            font-size: 15px;
            user-select: none;
        }
        .faq-container .faq-question:hover { background: rgba(234,169,36,0.04); }
        .faq-container .faq-question .q-text {
            flex: 1;
            font-size: 15px;
            line-height: 1.6;
            white-space: normal;
            word-break: break-word;
        }
        .faq-container .faq-question .q-number {
            display: inline-block;
            background: var(--gold);
            color: #fff;
            min-width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .faq-container .faq-toggle {
            font-size: 1.3rem;
            color: var(--gold);
            transition: transform 0.3s;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .faq-container .faq-item.open .faq-toggle { transform: rotate(45deg); }
        .faq-container .faq-answer {
            padding: 0 24px 20px 24px;
            color: #444;
            font-size: 14px;
            line-height: 1.8;
            display: none;
            text-align: left;
        }
        .faq-container .faq-item.open .faq-answer { display: block; }
        .faq-answer p { margin: 0 0 10px; }
        .faq-answer ul, .faq-answer ol { margin: 8px 0; padding-left: 0; list-style: none; }
        .faq-answer ul li, .faq-answer ol li {
            margin-bottom: 6px;
            padding-left: 0;
        }
        .faq-answer .answer-point {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
        }
        .faq-answer .point-label {
            display: inline-block;
            background: #f0f0f0;
            color: var(--navy);
            min-width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .faq-list-wrapper {
            background: #FFFDF5;
            border-radius: 16px;
            padding: 16px 12px;
            margin-top: 16px;
            min-height: 200px;
            /* Auto-expands as FAQ items are added */
        }
        .faq-list-wrapper .faq-item {
            margin-bottom: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #eef0f4;
            transition: box-shadow 0.2s;
        }
        .faq-list-wrapper .faq-item:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .faq-list-wrapper .faq-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="/" class="page-header-brand">
            <img src="assets/springbee-icon.png" alt="SpringBees">
            <span class="brand-name">Spring<span class="gold">Bee</span> Hub</span>
        </a>
        <h1>❓ Frequently Asked Questions</h1>
        <p>Common questions about SpringBees sensors, gateways, and network setup</p>
    </div>
    <div class="faq-container">
        <div class="faq-nav">
            <a href="/" class="back-link">>>> Back to Home</a>
        </div>
        <div class="faq-list-wrapper">
            <div id="faq-list" class="loading">Loading FAQ...</div>
        </div>
    </div>

    <script>
    document.addEventListener('click', function(e) {
        const q = e.target.closest('.faq-question');
        if (q) q.parentElement.classList.toggle('open');
    });

    (function loadFaqFromGitHub() {
        const REPO = 'SpringbeeHub/sensorbees-hub';
        const BRANCH = 'main';
        const FOLDER = 'faq';

        function markdownToAnswerHtml(md) {
            // Remove frontmatter
            md = md.replace(/^---[\s\S]*?---\n*/, '');
            // Bold
            md = md.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Italic
            md = md.replace(/\*(.+?)\*/g, '<em>$1</em>');
            // Numbered list items → A B C labels
            let listIndex = 0;
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            md = md.replace(/^\d+\.\s+(.+)$/gm, function(match, content) {
                const label = letters[listIndex] || (listIndex + 1);
                listIndex++;
                return `<div class="answer-point"><span class="point-label">${label}</span><span>${content}</span></div>`;
            });
            // Unordered list items
            md = md.replace(/^[\-\*]\s+(.+)$/gm, function(match, content) {
                const label = letters[listIndex] || (listIndex + 1);
                listIndex++;
                return `<div class="answer-point"><span class="point-label">${label}</span><span>${content}</span></div>`;
            });
            // Paragraphs
            md = md.replace(/\n\n/g, '</p><p>');
            md = '<p>' + md + '</p>';
            md = md.replace(/<p>\s*<\/p>/g, '');
            return md;
        }

        const API_PROXY = 'https://oauth.sensorbeeshub.com/api/github';

        fetch(`${API_PROXY}?url=${encodeURIComponent(`https://api.github.com/repos/${REPO}/contents/${FOLDER}?ref=${BRANCH}`)}`)
            .then(res => res.json())
            .then(files => {
                if (!Array.isArray(files) || files.length === 0) throw new Error('No files');
                const mdFiles = files.filter(f => f.name.endsWith('.md'));
                return Promise.all(mdFiles.map(f =>
                    fetch(`${API_PROXY}?url=${encodeURIComponent(f.download_url)}`).then(r => r.text()).then(text => ({ body: text }))
                ));
            })
            .then(items => {
                const faqList = document.getElementById('faq-list');
                faqList.innerHTML = '';
                items.forEach((item, idx) => {
                    const fmMatch = item.body.match(/^---[\s\S]*?title:\s*["']?([\s\S]+?)["']?\s*$/m);
                    const title = fmMatch ? fmMatch[1].replace(/\n\s+/g, ' ').trim() : 'FAQ';

                    const faqEl = document.createElement('div');
                    faqEl.className = 'faq-item';
                    faqEl.innerHTML = `
                        <div class="faq-question">
                            <span class="q-text"><span class="q-number">Q${idx + 1}</span>${title}</span>
                            <span class="faq-toggle">+</span>
                        </div>
                        <div class="faq-answer">
                            ${markdownToAnswerHtml(item.body)}
                        </div>
                    `;
                    faqList.appendChild(faqEl);
                });
                // Auto-open first FAQ
                const firstItem = faqList.querySelector('.faq-item');
                if (firstItem) firstItem.classList.add('open');
            })
            .catch(err => {
                console.warn('Failed to load FAQ:', err);
                document.getElementById('faq-list').innerHTML = '<p>FAQ currently unavailable.</p>';
            });
    })();
    </script>
</body>
</html>
